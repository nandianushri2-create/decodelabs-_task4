<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>decodelabs-project4</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="main">
        <div class="title">
            <h4>DecodeLabs-Project4</h4>
        </div>
        <div class="content">
            <h1>Create your account</h1>
            <p>Every field here is checked as you go- you'll see exactly what to fix, right where it needs fixing.</p>
        </div>
        <div class="container">
            <div class="box1">
                <h4>Full name</h4>
                <input type="text" placeholder="Enter your full name">
            </div>
                
            <div class="box2">
                <h4>Email address</h4>
                <input type="email" placeholder="Enter your email">
            </div>
            <div class="box3">
                <h4>Password</h4>
                <input type="password" placeholder="Enter your password">
            </div>

            <p>At least 8 characters, with an uppercase letter, a lowercase letter, and a number,and a symbol.</p>

            <div class="box4">
                <h4>Confirm password</h4>
                <input type="password" placeholder="Confirm your password">
            </div>

            <div class="checkbox">
                <input type="checkbox" id="checkbox">
                <label for="checkbox">I agree to the <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a></label>
            </div>

            <button>Create Account</button>
        </div>
    </div>
    
</body>
</html>
